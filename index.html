<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b11">
<title>Us</title>
<style>
/* ===== 1. COLORS & SIZES: change these first ===== */
:root{
  --bg:#0d0b11;      /* page background */
  --card:#17131d;    /* cards, bars */
  --card2:#221c2b;   /* inputs, received bubbles */
  --line:#ffffff14;  /* thin borders */
  --txt:#f4f0f6;     /* main text */
  --mut:#9a92a3;     /* faded text */
  --acc:#e8a4c0;     /* main accent (pink) */
  --acc2:#c47a9e;    /* darker accent */
  --bad:#ff6b81;     /* red: badges, likes, errors */
  --radius:16px;     /* roundness of cards */
}
/* ===== 2. BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .center{text-align:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
.hint{text-align:center;color:var(--mut);padding:30px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ===== 3. LAYOUT: top bar, scroll area, bottom nav ===== */
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:19px}
.view{flex:1;overflow:auto;min-height:0}
.pad{max-width:640px;margin:0 auto;padding:16px}
.nav{display:flex;background:#0f0c14;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 7px;font-size:11px;color:var(--mut);position:relative}
.nav .on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
/* ===== 4. BUTTONS & INPUTS ===== */
.btn{background:linear-gradient(120deg,#eab0c8,var(--acc2));color:#2a1220;font-weight:650;border-radius:14px;padding:12px 18px}
.btn.soft{background:var(--card2);color:var(--txt)}
.btn.full{width:100%} .btn.sm{padding:8px 14px;font-size:14px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.ib.acc{background:var(--acc);color:#2a1220}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
/* ===== 5. AVATARS (size classes: sm, big) ===== */
.av{--h:330;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;font-weight:650;background:hsl(var(--h) 45% 32%);color:hsl(var(--h) 80% 90%)}
.av.sm{width:32px;height:32px;font-size:14px}
.av.big{width:92px;height:92px;font-size:38px}
.av img{width:100%;height:100%;object-fit:cover}
/* ===== 6. CHAT ===== */
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.b{max-width:80%;padding:9px 13px;background:var(--card2);border-radius:18px 18px 18px 5px;align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.b.me{align-self:flex-end;background:linear-gradient(120deg,#d98fb0,#b36a8f);color:#fff;border-radius:18px 18px 5px 18px}
.b small{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:2px}
.file{display:flex;gap:8px;align-items:center;color:inherit;margin-bottom:4px}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer input{border-radius:22px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pip{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
/* ===== 7. FEED ===== */
.pic{display:block;max-width:100%;max-height:440px;border-radius:12px;margin-top:10px;background:var(--card2)}
.b .pic{margin:0 0 4px}
.act button{display:flex;gap:6px;align-items:center;margin-top:10px;padding:6px 12px;border-radius:18px;background:var(--card2);color:var(--mut)}
.act button.on{color:var(--bad)} .act button.on svg{fill:var(--bad)}
/* ===== 8. LOGIN & TOAST ===== */
.auth{max-width:420px;margin:auto;padding:8vh 22px}
.logo{font-size:46px;font-weight:700;letter-spacing:-2px} .logo b{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;padding:10px;border-radius:11px;color:var(--mut)} .seg .on{background:var(--bg);color:var(--txt)}
.auth input{margin-bottom:10px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b2433;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script type="module">
/* ===== CONFIG ===== */
const CONFIG={
  firebase:{apiKey:"AIzaSyAi27biKcUGvCB4kXsXEdgeq85JLBb7a_Y",authDomain:"library-a60e3.firebaseapp.com",databaseURL:"https://library-a60e3-default-rtdb.firebaseio.com",projectId:"library-a60e3",storageBucket:"library-a60e3.firebasestorage.app",messagingSenderId:"933820691428",appId:"1:933820691428:web:25dcddcfc078ac910acdf1"},
  cloudinary:{cloudName:"dwf9uonlj",uploadPreset:"our_chat"}
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,set,push,update,onValue,query,limitToLast} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
const fb=initializeApp(CONFIG.firebase),auth=getAuth(fb),db=getDatabase(fb);

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',heart:'<path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',clip:'<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>',back:'<path d="M15 5l-7 7 7 7"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const hue=n=>{let h=0;for(const c of String(n||"?"))h=(h*31+c.codePointAt(0))%360;return h};
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const when=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?fmtT(t):d.toLocaleDateString([],{month:"short",day:"numeric"})+", "+fmtT(t)};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("show"),2500)};
const nm=u=>S.users[u]?.name||"Someone";
const av=(u,c="")=>{const p=S.users[u]||{};return p.photo?`<span class="av ${c}"><img src="${esc(p.photo)}" alt=""></span>`:`<span class="av ${c}" style="--h:${hue(p.name)}">${esc((p.name||"?")[0].toUpperCase())}</span>`};
const cidOf=(a,b)=>[a,b].sort().join("_");
async function upload(file){
  const f=new FormData();f.append("file",file);f.append("upload_preset",CONFIG.cloudinary.uploadPreset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/auto/upload`,{method:"POST",body:f}),j=await r.json();
  if(!j.secure_url)throw new Error(j.error?.message||"Upload failed");
  return {url:j.secure_url,type:j.resource_type,name:file.name};
}

/* ===== STATE: S.me = signed-in user, S.chat = uid of open chat, S.page = chats | feed | me ===== */
const S={me:null,mode:"in",page:"chats",chat:null,q:"",users:{},chats:{},reads:{},posts:[],likes:{},msgs:[],pf:null};
const isUnread=(c,v)=>v.by!==S.me.uid&&v.t>(S.reads[c]||0);

/* ===== LIVE DATA ===== */
let offs=[],offMsgs=()=>{};
const watch=(path,fn,q)=>{const r=ref(db,path);offs.push(onValue(q?q(r):r,s=>{fn(s.val()||{});fill()}))};
onAuthStateChanged(auth,u=>{
  offs.forEach(f=>f());offs=[];offMsgs();S.me=u;S.chat=null;
  if(u){
    update(ref(db,"users/"+u.uid),{name:u.displayName||u.email.split("@")[0]});
    watch("users",v=>S.users=v);
    watch("userChats/"+u.uid,v=>S.chats=v);
    watch("reads/"+u.uid,v=>S.reads=v);
    watch("likes",v=>S.likes=v);
    watch("posts",v=>S.posts=Object.entries(v).map(([id,p])=>({id,...p})).sort((a,b)=>b.t-a.t),r=>query(r,limitToLast(50)));
  }
  draw();
});
function openChat(uid){
  if(uid===S.me.uid)return;
  S.chat=uid;S.msgs=[];const cid=cidOf(S.me.uid,uid);
  offMsgs=onValue(query(ref(db,`chats/${cid}/msgs`),limitToLast(100)),s=>{
    S.msgs=Object.values(s.val()||{}).sort((a,b)=>a.t-b.t);
    set(ref(db,`reads/${S.me.uid}/${cid}`),Date.now());fill();
  });
  draw();
}
async function send(m){
  const me=S.me.uid,cid=cidOf(me,S.chat),t=Date.now();
  await push(ref(db,`chats/${cid}/msgs`),{...m,from:me,t});
  const last=m.text||(m.type==="image"?"📷 Photo":"📎 File");
  await update(ref(db),{[`userChats/${me}/${cid}`]:{with:S.chat,last,t,by:me},[`userChats/${S.chat}/${cid}`]:{with:me,last,t,by:me}});
}

/* ===== SCREENS (HTML) ===== */
const msgHTML=m=>{
  const body=m.type==="image"?`<a href="${esc(m.url)}" target="_blank"><img class="pic" src="${esc(m.url)}" loading="lazy"></a>`:m.url?`<a class="file" href="${esc(m.url)}" target="_blank">${ic("file")} ${esc(m.name||"File")}</a>`:"";
  return `<div class="b ${m.from===S.me.uid?"me":""}">${body}${esc(m.text||"")}<small>${fmtT(m.t)}</small></div>`;
};
const rowHTML=(uid,sub,t,pip)=>`<div class="item" data-act="open" data-uid="${uid}">${av(uid)}<div class="grow"><b class="ell">${esc(nm(uid))}</b><div class="mut small ell">${esc(sub)}</div></div>${t?`<span class="mut small">${when(t)}</span>`:""}${pip?'<i class="pip"></i>':""}</div>`;
const listHTML=()=>{
  if(S.q)return Object.keys(S.users).filter(u=>u!==S.me.uid&&nm(u).toLowerCase().includes(S.q)).map(u=>rowHTML(u,"Tap to chat")).join("")||'<div class="hint">No one found</div>';
  return Object.entries(S.chats).sort((a,b)=>b[1].t-a[1].t).map(([c,v])=>rowHTML(v.with,v.last,v.t,isUnread(c,v))).join("")||'<div class="hint">No chats yet. Search for someone above 👆</div>';
};
const postHTML=p=>{
  const n=Object.keys(S.likes[p.id]||{}),on=n.includes(S.me.uid);
  return `<div class="card"><div class="row" data-act="open" data-uid="${p.uid}">${av(p.uid,"sm")}<div class="grow"><b>${esc(nm(p.uid))}</b><div class="mut small">${when(p.t)}</div></div></div>${p.text?`<p style="white-space:pre-wrap">${esc(p.text)}</p>`:""}${p.img?`<img class="pic" src="${esc(p.img)}" loading="lazy">`:""}<div class="act"><button class="${on?"on":""}" data-act="like" data-id="${p.id}">${ic("heart")}${n.length}</button></div></div>`;
};
function draw(){
  if(!S.me){
    const up=S.mode==="up";
    app.innerHTML=`<div class="auth"><div class="logo">U<b>s</b></div><div class="mut">Chat with anyone.</div>
    <div class="seg"><button class="${up?"":"on"}" data-act="mode" data-m="in">Log in</button><button class="${up?"on":""}" data-act="mode" data-m="up">Sign up</button></div>
    ${up?'<input id="nm" placeholder="Your name" autocomplete="name">':""}<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ chars)" autocomplete="current-password">
    <div class="err" id="err"></div><button class="btn full" data-act="auth">${up?"Create account":"Log in"}</button></div>`;
    return;
  }
  if(S.chat){
    app.innerHTML=`<div class="top"><button class="ib" data-act="back">${ic("back")}</button>${av(S.chat,"sm")}<h1 class="ell">${esc(nm(S.chat))}</h1></div><div class="msgs" id="msgs"></div>
    <div class="composer"><button class="ib" data-act="attach">${ic("clip")}</button><input id="txt" placeholder="Message" autocomplete="off"><button class="ib acc" data-act="send">${ic("send")}</button></div><input type="file" id="file" hidden>`;
    fill();return;
  }
  const pages={
    chats:`<div class="pad"><input id="q" placeholder="Search people…" value="${esc(S.q)}"><div id="list"></div></div>`,
    feed:`<div class="pad"><div class="card"><textarea id="ptxt" rows="2" placeholder="Share something…"></textarea><div class="row" style="margin-top:10px"><button class="btn soft sm" data-act="pickimg">${ic("clip")} Photo</button><span class="mut small grow ell" id="pname"></span><button class="btn sm" data-act="post">Post</button></div></div><div id="feed"></div></div><input type="file" id="pfile" accept="image/*" hidden>`,
    me:`<div class="pad center"><div data-act="avatar" style="display:inline-block;margin-top:20px">${av(S.me.uid,"big")}</div><h2>${esc(nm(S.me.uid))}</h2><div class="mut small">${esc(S.me.email)}</div><p class="mut small">Tap the photo to change it</p><button class="btn soft" data-act="logout">Log out</button></div><input type="file" id="afile" accept="image/*" hidden>`
  };
  const titles={chats:"Chats",feed:"Moments",me:"Profile"};
  const tabs=[["chats","chat"],["feed","heart"],["me","user"]].map(([k,i])=>`<button class="${S.page===k?"on":""}" data-act="nav" data-p="${k}">${ic(i)}${titles[k]}${k==="chats"?'<span class="badge" id="bdg" hidden></span>':""}</button>`).join("");
  app.innerHTML=`<div class="top"><h1>${titles[S.page]}</h1></div><div class="view">${pages[S.page]}</div><nav class="nav">${tabs}</nav>`;
  fill();
}
/* fill() refreshes only the live parts, so typing never gets interrupted */
function fill(){
  if(!S.me)return;
  const b=$("#bdg");if(b){const n=Object.entries(S.chats).filter(([c,v])=>isUnread(c,v)).length;b.hidden=!n;b.textContent=n}
  const m=$("#msgs");
  if(m){const end=m.scrollHeight-m.scrollTop-m.clientHeight<80;m.innerHTML=S.msgs.map(msgHTML).join("")||'<div class="hint">Say hi 👋</div>';if(end)m.scrollTop=m.scrollHeight}
  if($("#list"))$("#list").innerHTML=listHTML();
  if($("#feed"))$("#feed").innerHTML=S.posts.map(postHTML).join("")||'<div class="hint">No posts yet</div>';
}

/* ===== ACTIONS ===== */
const A={
  mode:e=>{S.mode=e.dataset.m;draw()},
  nav:e=>{S.page=e.dataset.p;draw()},
  open:e=>openChat(e.dataset.uid),
  back:()=>{offMsgs();S.chat=null;draw()},
  attach:()=>$("#file").click(),
  pickimg:()=>$("#pfile").click(),
  avatar:()=>$("#afile").click(),
  logout:()=>signOut(auth),
  send:()=>{const i=$("#txt"),t=i.value.trim();if(t){i.value="";send({text:t})}},
  like:e=>{const id=e.dataset.id,on=S.likes[id]?.[S.me.uid];update(ref(db,"likes/"+id),{[S.me.uid]:on?null:true})},
  post:async()=>{
    const text=$("#ptxt").value.trim();if(!text&&!S.pf)return;
    try{toast("Posting…");const img=S.pf?(await upload(S.pf)).url:"";
      await push(ref(db,"posts"),{uid:S.me.uid,text,img,t:Date.now()});S.pf=null;draw()}catch(e){toast(e.message)}
  },
  auth:async()=>{
    const em=$("#em").value.trim(),pw=$("#pw").value,name=$("#nm")?.value.trim();
    try{
      if(S.mode==="up"){if(!name)throw{code:"enter your name"};const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:name});await update(ref(db,"users/"+c.user.uid),{name})}
      else await signInWithEmailAndPassword(auth,em,pw);
    }catch(e){$("#err").textContent=String(e.code||e.message).replace("auth/","").replace(/-/g," ")}
  }
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el)A[el.dataset.act]?.(el)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="txt")A.send()});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim().toLowerCase();fill()}});
document.addEventListener("change",async e=>{
  const f=e.target.files?.[0];if(!f)return;const id=e.target.id;e.target.value="";
  try{
    if(id==="pfile"){S.pf=f;$("#pname").textContent=f.name;return}
    toast("Uploading…");const r=await upload(f);
    if(id==="file")await send({type:r.type,url:r.url,name:r.name});
    if(id==="afile")await update(ref(db,"users/"+S.me.uid),{photo:r.url});
  }catch(x){toast(x.message)}
});
</script>
</body>
</html>

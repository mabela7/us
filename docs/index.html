<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>Us</title>
<link rel="icon" id="fav" href="data:,">
<link rel="apple-touch-icon" id="touch" href="data:,">
<style>
/* ===== 1. COLORS & SIZES: change these first ===== */
:root{
  --bg:#0b0811;       /* page background */
  --card:#17121f;     /* cards, bars */
  --card2:#221b2d;    /* inputs, buttons */
  --line:#ffffff12;   /* thin borders */
  --txt:#f5f0f8;      /* main text */
  --mut:#8c8296;      /* faded text */
  --acc:#7289da;      /* main accent */
  --acc2:#5b6eae;     /* darker accent */
  --bad:#ff6b81;      /* red: badges, likes, delete */
  --ok:#2ecc71;       /* green: answer call */
  --radius:16px;
  --bubble:#1d1628;                                      /* received bubble */
  --me-bubble:linear-gradient(135deg,#5b6eae,#7289da);   /* sent bubble */
}
/* ===== 2. BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .center{text-align:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
.hint{text-align:center;color:var(--mut);padding:30px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ===== 3. LAYOUT: top bar, scroll area, bottom nav ===== */
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:58px;border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:17px;min-width:0}
.view{flex:1;overflow:auto;min-height:0}
.pad{max-width:640px;margin:0 auto;padding:16px}
.nav{display:flex;background:#08060d;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:9px 0 7px;font-size:11px;color:var(--mut);position:relative}
.nav .on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
/* ===== 4. BUTTONS & INPUTS ===== */
.btn{background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff;font-weight:650;border-radius:14px;padding:12px 18px}
.btn.soft{background:var(--card2)} .btn.full{width:100%} .btn.sm{padding:8px 14px;font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.ib.acc{background:var(--acc)}
.ib.recording{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
/* ===== 5. AVATARS (size classes: sm, big) ===== */
.av{--h:220;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;font-weight:650;background:hsl(var(--h) 45% 32%);color:hsl(var(--h) 80% 90%)}
.av.sm{width:32px;height:32px;font-size:14px} .av.big{width:92px;height:92px;font-size:38px}
.av img{width:100%;height:100%;object-fit:cover}
/* ===== 6. CHAT: rows, bubbles, media, replies ===== */
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.mr{display:flex;flex-direction:column;align-items:flex-start;touch-action:pan-y;transition:transform .12s}
.mr.me{align-items:flex-end}
.b{width:fit-content;max-width:min(86%,340px);padding:9px 13px;background:var(--bubble);border-radius:18px 18px 18px 6px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.b img{-webkit-user-drag:none}
.b.me{background:var(--me-bubble);color:#fff;border-radius:18px 18px 6px 18px}
.b.hl{outline:2px solid var(--acc)}
.b.media{background:none;padding:0;border-radius:0}  /* files with no text: no bubble */
.b.media .fc{background:var(--card2)}
.mt{font-size:10.5px;color:var(--mut);margin-top:3px;padding:0 2px}
.pic{display:block;max-width:100%;max-height:360px;border-radius:14px;background:var(--card2)}
/* video player: no browser controls, only a thin seek line */
.vp{position:relative;display:inline-block;line-height:0;border-radius:14px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.vp video{display:block;width:auto;height:auto;max-width:min(86vw,340px);max-height:360px}
.vp.big{border-radius:8px} .vp.big video{max-width:100vw;max-height:calc(100dvh - 140px)}
.vpplay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .15s}
.vpplay span{width:54px;height:54px;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;font-size:22px;padding-left:4px}
.vp:not(.paused) .vpplay{opacity:0}
.vpbar{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:flex-end;touch-action:none}
.vptrack{width:100%;height:3px;background:#ffffff45} .vp.drag .vptrack{height:8px}
.vpfill{height:100%;width:0;background:var(--acc)}
.b audio{width:230px;max-width:100%;height:38px;display:block;filter:invert(.9) hue-rotate(190deg)}
.fc{display:flex;gap:8px;align-items:center;padding:9px;background:#ffffff12;border-radius:12px;cursor:pointer}
.rq{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;margin-bottom:6px;background:#00000030;border-left:3px solid var(--acc);border-radius:6px;font-size:12px;cursor:pointer;overflow:hidden}
.rqt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rth{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:#000;display:block}  /* mini picture / video frame in replies */
.rth.ico{display:grid;place-items:center;background:var(--card2);font-size:18px}
.rp{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);border-left:3px solid var(--acc);font-size:13px}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer input{border-radius:22px}
#gifBtn{display:none;flex:none;font-size:12px;font-weight:800;letter-spacing:.3px}
#gifBtn.show{display:grid}
.gif-store{position:fixed;inset:0;z-index:180;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.gif-store.show{display:flex}
.gif-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.gif-head h2{font-size:17px;margin:0;flex:1}
.gif-search{padding:12px;border-bottom:1px solid var(--line)}
.gif-results{flex:1;min-height:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.gif-results button{padding:0;border-radius:12px;overflow:hidden;background:var(--card2);min-height:110px}
.gif-results img{display:block;width:100%;height:150px;object-fit:cover}
.gif-note{grid-column:1/-1;text-align:center;color:var(--mut);padding:24px 10px}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pip{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
/* call log rows (started / ended / declined / missed): centered pill, not a chat bubble */
.mr.cx{align-items:center}
.cxp{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:13px}
.cxi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--card2)}
.cxs{color:var(--mut);font-size:11px}
.cxp.cok .cxi{background:#2ecc7126} .cxp.cok .cxt{color:var(--ok)}
.cxp.cbad .cxi{background:#ff6b8126} .cxp.cbad .cxt{color:var(--bad)}
/* ===== 7. POP-UPS: viewer, long-press menu, delete box, call ===== */
.viewer{position:fixed;inset:0;z-index:100;background:#08070cf5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:64px 12px 20px}
.viewer.show{display:flex}
#vc{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#vc img,#vc video{max-width:100%;max-height:100%;border-radius:8px}
#vc iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}
#vc pre{width:100%;max-width:600px;height:100%;overflow:auto;margin:0;padding:16px;background:var(--card);border-radius:12px;white-space:pre-wrap;font-size:13px}
.viewer .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px}
.viewer .dl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px}
.ov{position:fixed;inset:0;z-index:110;display:none}.ov.show{display:block}
.menu{position:fixed;z-index:120;display:none;background:#251d30;border:1px solid #ffffff22;border-radius:16px;padding:6px;min-width:160px;box-shadow:0 10px 40px #0009}
.menu.show{display:block}
.menu button{display:block;width:100%;padding:11px 13px;border-radius:10px;text-align:left}
.menu button:active{background:#ffffff15} .menu .del{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:200;background:#00000080;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;text-align:center}
.modal h2{margin:10px 0 6px;font-size:20px} .modal p{color:var(--mut);margin:0 0 18px}
.btns{display:flex;gap:10px}.btns button{flex:1;padding:12px;border-radius:14px;font-weight:650;color:#fff}
.no{background:var(--card2)} .red{background:var(--bad)} .green{background:var(--ok)}
#grid{display:none;gap:10px;margin-bottom:16px}
#grid video{width:100%;height:180px;object-fit:cover;background:#000;border-radius:14px}
.thread{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.thread.show{display:flex}
.cm{margin-top:12px;padding-left:10px;border-left:2px solid var(--line)}
.cm button{color:var(--mut);padding:2px 0;margin-right:10px}
.pk{flex:1;font-size:12px;color:var(--mut)}
.pk select option{background:var(--card2);color:var(--txt)}
.pk select{width:100%;height:42px;margin-top:4px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;outline:none}
.pk input{height:38px;padding:2px;margin-top:4px;border-radius:10px}
.b{position:relative}
.msgs{overflow-x:hidden}
.stk{position:absolute;pointer-events:none;max-width:none;z-index:2}
.pv .stk{pointer-events:auto;cursor:grab;touch-action:none}
/* ===== 8. FEED, LOGIN, TOAST ===== */
.act{display:flex;gap:8px}
.act button{display:flex;gap:6px;align-items:center;margin-top:10px;padding:6px 12px;border-radius:18px;background:var(--card2);color:var(--mut)}
.act button.on{color:var(--bad)} .act button.on svg{fill:var(--bad)}
.auth{max-width:420px;margin:auto;padding:8vh 22px}
.logo{font-size:46px;font-weight:700;letter-spacing:-2px} .logo b{color:var(--acc)}
.logo img{width:84px;height:84px;border-radius:20px;object-fit:cover;display:block}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;padding:10px;border-radius:11px;color:var(--mut)} .seg .on{background:var(--bg);color:var(--txt)}
.auth input{margin-bottom:10px} .err{color:var(--bad);min-height:20px;font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b2433;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90%;text-align:center}
.toast.show{opacity:1}
/* upload bar (top): blue while uploading, red on fail, then slides away */
.up{position:fixed;top:0;left:0;right:0;z-index:400;padding:calc(env(safe-area-inset-top) + 8px) 14px 0;background:var(--card);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .25s,background .25s;font-size:13px;pointer-events:none}
.up.show{transform:none} .up.bad{background:var(--bad);color:#fff}
.upt{padding-bottom:7px} .upb{height:4px;background:#ffffff25;margin:0 -14px}
.upf{height:100%;width:0;background:var(--acc);transition:width .15s} .up.bad .upf{background:#fff} .up.ok .upf{background:var(--ok)}
/* ===== 9. CHAT BACKGROUND + BUBBLE OFFERS ===== */
.btn:disabled{opacity:.55}
.mw{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.mw .msgs{position:relative;z-index:1;min-height:0}
.cbg{position:absolute;inset:0;overflow:hidden;z-index:0}
.bgimg{position:absolute;max-width:none;height:auto;transform:translate(-50%,-50%);pointer-events:none;-webkit-user-drag:none;user-select:none}
.bgdim{position:absolute;inset:0}
.bgpvw{position:sticky;top:0;z-index:5;background:var(--card);padding-bottom:10px}
.bgpv{position:relative;overflow:hidden;margin:0 auto;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.bgpv.dg{touch-action:none;cursor:grab}
.pvm{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:10px 12px;overflow:hidden;pointer-events:none}
.pvm .mr{zoom:.66}
.pvm{gap:6px}
.bp{position:relative;width:fit-content;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.bo{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="up" id="up"><div class="upt" id="upt"></div><div class="upb"><div class="upf" id="upf"></div></div></div>

<!-- full-screen media viewer -->
<div class="viewer" id="viewer"><button class="btn sm dl" data-act="dl">Download</button><button class="ib x" data-act="closeview">✕</button><div id="vc"></div></div>
<!-- GIF store -->
<div class="gif-store" id="gifStore">
  <div class="gif-head"><button class="ib" data-act="gifClose">‹</button><h2>GIFs</h2><span class="mut small">GIPHY</span></div>
  <div class="gif-search"><input id="gifQuery" placeholder="Search GIFs…" autocomplete="off"></div>
  <div class="gif-results" id="gifResults"><div class="gif-note">Loading trending GIFs…</div></div>
</div>
<!-- discussion thread -->
<div class="thread" id="th"></div>
<!-- friend profile / chat background -->
<div class="thread" id="fp"></div>
<!-- save or discard chat background -->
<div class="modal" id="sm"><div class="box"><h2>Save background?</h2><p>You changed this chat's background.</p><div class="btns"><button class="no" data-act="fpdiscard">Discard</button><button style="background:var(--acc)" data-act="fpsave">Save</button></div></div></div>
<!-- send bubble to... -->
<div class="modal" id="pm"><div class="box" style="text-align:left"><h2 style="text-align:center">Send bubble to</h2><div id="pl" style="max-height:52dvh;overflow:auto;margin-bottom:14px"></div><button class="btn soft full" data-act="pclose">Cancel</button></div></div>
<!-- long-press menu -->
<div class="ov" id="ov" data-act="closemenu"></div>
<div class="menu" id="menu"><button data-act="reply">↩ Reply</button><button data-act="copy">📋 Copy</button><button data-act="dl" id="mdl">⬇ Download</button><button class="del" data-act="del" id="mdel">⌫ Delete</button></div>
<!-- delete box -->
<div class="modal" id="dm"><div class="box"><h2 id="dh">Delete for both?</h2><p id="dp">This can't be undone.</p><div class="btns"><button class="no" data-act="dno">No</button><button class="red" data-act="dyes">Yes</button></div></div></div>
<!-- call box -->
<div class="modal" id="cm" style="z-index:250;background:#08070cf8"><div class="box"><div id="cav"></div><h2 id="ct">Call</h2><p id="cs"></p>
  <div id="grid"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video></div>
  <div class="btns" id="cin"><button class="red" data-act="cdecline">Decline</button><button class="green" data-act="canswer">Answer</button></div>
  <div class="btns" id="cact"><button class="red" data-act="cend">End call</button></div></div></div>

<script type="module">
/* ===== CONFIG ===== */
const CONFIG={
  firebase:{apiKey:"AIzaSyAi27biKcUGvCB4kXsXEdgeq85JLBb7a_Y",authDomain:"library-a60e3.firebaseapp.com",databaseURL:"https://library-a60e3-default-rtdb.firebaseio.com",projectId:"library-a60e3",storageBucket:"library-a60e3.firebasestorage.app",messagingSenderId:"933820691428",appId:"1:933820691428:web:25dcddcfc078ac910acdf1"},
  cloudinary:{cloudName:"dwf9uonlj",uploadPreset:"our_chat"},

  push:{url:"https://waexrkwpoeualglkntjs.supabase.co/functions/v1/dynamic-handler"},  /* Supabase edge function */
  ice:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}]
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,set,get,push,update,remove,onValue,onChildAdded,onDisconnect,query,limitToLast} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
const fb=initializeApp(CONFIG.firebase),auth=getAuth(fb),db=getDatabase(fb);
let srvOff=0;onValue(ref(db,".info/serverTimeOffset"),s=>{srvOff=s.val()||0});
const sNow=()=>Date.now()+srvOff;  /* server-aligned clock, so phones with a wrong clock still agree on call age */

const $=s=>document.querySelector(s),app=$("#app");

const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',heart:'<path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',clip:'<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>',back:'<path d="M15 5l-7 7 7 7"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',vid:'<rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
/* ===== APP ICON: lives in Firebase (appIcon = image URL), downloaded once, cached on the phone. Not bundled in the app. ===== */
let ICON=null,iconOff=null;try{ICON=localStorage.getItem("iconData")}catch{}
const LOGO=()=>ICON?`<img src="${ICON}" alt="Us">`:'U<b>s</b>';
function applyIcon(){
  if(!ICON)return;
  $("#fav").href=ICON;$("#touch").href=ICON;
  const l=$(".logo");if(l)l.innerHTML=LOGO();
}
async function loadIcon(url){
  try{
    if(ICON&&localStorage.getItem("iconUrl")===url)return;  /* same icon already saved: no download */
    const b=await (await fetch(url)).blob();
    const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});

    applyIcon();
  }catch{}
}
function iconWatch(){
  if(iconOff)return;

/* ===== UPLOAD: Cloudinary, 6 MB chunks for big files, live progress bar on top, red + auto-hide on failure ===== */
const CHUNK=6*1024*1024;let upT=0;
function upBar(txt,pct,state){
  const b=$("#up");clearTimeout(upT);b.className="up show"+(state?" "+state:"");
  $("#upt").textContent=txt;$("#upf").style.width=pct+"%";
  if(state)upT=setTimeout(()=>b.classList.remove("show"),state==="bad"?3500:700);
}
const xhrSend=(body,headers,onProg)=>new Promise((ok,no)=>{
  const x=new XMLHttpRequest();x.open("POST",`https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/auto/upload`);
  for(const k in headers)x.setRequestHeader(k,headers[k]);
  x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded)};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status>=200&&x.status<300?ok(j):no(new Error(j.error?.message||"Upload failed ("+x.status+")"))};
  x.onerror=()=>no(new Error("Network error"));x.ontimeout=()=>no(new Error("Timed out"));
  x.send(body);
});
async function upload(file){
  const name=file.name||"file",short=name.length>26?name.slice(0,24)+"…":name,total=file.size,n=Math.max(1,Math.ceil(total/CHUNK)),id=Date.now()+"-"+Math.random().toString(36).slice(2);
  let j;
  try{
    upBar("Uploading "+short+" 0%",0);
    for(let i=0;i<n;i++){
      const s=i*CHUNK,e=Math.min(total,s+CHUNK),len=e-s;
      for(let tr=0;;tr++){  /* each part retries twice before giving up */
        const f=new FormData();f.append("file",n>1?file.slice(s,e):file,name);f.append("upload_preset",CONFIG.cloudinary.uploadPreset);
        const h=n>1?{"X-Unique-Upload-Id":id,"Content-Range":`bytes ${s}-${e-1}/${total}`}:{};
        try{
          j=await xhrSend(f,h,l=>{const p=Math.min(99,(s+Math.min(l,len))/total*100);upBar(`Uploading ${short} ${Math.round(p)}%`+(n>1?` · part ${i+1}/${n}`:""),p)});
          break;
        }catch(err){
          if(tr>=2)throw err;
          upBar(`Retrying ${short} · part ${i+1}/${n}`,s/total*100);await new Promise(r=>setTimeout(r,1200*(tr+1)));
        }
      }
    }
    if(!j?.secure_url)throw new Error(j?.error?.message||"Upload failed");
    upBar("Uploaded "+short,100,"ok");
    return {url:j.secure_url,type:j.resource_type,mime:file.type||"",name:file.name};
  }catch(err){upBar("Upload failed: "+(err.message||"error"),100,"bad");throw err}
}
const MIMEX={"audio/webm":"webm","audio/mpeg":"mp3","audio/mp4":"m4a","audio/ogg":"ogg","video/mp4":"mp4","video/webm":"webm","image/jpeg":"jpg","image/png":"png","image/gif":"gif","image/webp":"webp","application/pdf":"pdf"};
function fileName(m){
  let n=String(m.name||"file").replace(/[\\/:*?"<>|]/g,"_").slice(0,80);
  if(!/\.[A-Za-z0-9]{2,5}$/.test(n)){
    const u=String(m.url||"").split("?")[0].match(/\.([A-Za-z0-9]{2,5})$/),mm=MIMEX[String(m.mime||"").split(";")[0]];
    const e=u?u[1]:mm;if(e)n+="."+e;
  }

}

const dlUrl=u=>/\/(image|video)\/upload\//.test(u)&&!u.includes("fl_attachment")?u.replace("/upload/","/upload/fl_attachment/"):u;
async function download(m){

}

/* ===== GIPHY GIF PICKER =====
   Create a beta API key at https://developers.giphy.com/dashboard/ and put it in CONFIG.giphy.apiKey.
   Beta keys allow 100 API calls per hour. Keep the key restricted/monitored; a key in frontend code is visible.
*/
let gifSearchTimer=0,gifLastQuery="",gifRequestSeq=0;
async function giphyRequest(path,query=""){
  const p=new URLSearchParams({api_key:CONFIG.giphy.apiKey,limit:"24",rating:"pg-13",lang:"en"});
  if(query)p.set("q",query);
  const r=await fetch(`https://api.giphy.com/v1/gifs/${path}?${p}`);
  if(!r.ok)throw new Error("GIPHY unavailable ("+r.status+")");
  return r.json();
}
function gifUrlOf(item){
  const images=item.images||{};
  return images.original?.url||images.downsized_medium?.url||images.fixed_width?.url||"";
}
function gifPreviewOf(item){
  const images=item.images||{};
  return images.fixed_width_small?.url||images.preview_gif?.url||images.downsized_small?.url||gifUrlOf(item);
}
function drawGifResults(items){
  const el=$("#gifResults");if(!el)return;
  const usable=(items||[]).filter(x=>gifUrlOf(x));
  el.innerHTML=usable.map((g,i)=>`<button type="button" data-act="gifSend" data-index="${i}" aria-label="Send GIF"><img src="${esc(gifPreviewOf(g)||gifUrlOf(g))}" alt="GIF" loading="lazy"></button>`).join("")||'<div class="gif-note">No GIFs found. Try another search.</div>';
  S.gifItems=usable;
}
async function loadGifs(query=""){
  const el=$("#gifResults");if(!el)return;
  if(CONFIG.giphy.apiKey==="YOUR_GIPHY_API_KEY"){el.innerHTML='<div class="gif-note">Add your GIPHY API key in CONFIG.giphy.apiKey to load GIFs.</div>';return}
  const seq=++gifRequestSeq;
  el.innerHTML='<div class="gif-note">Loading GIFs…</div>';
  try{
    const data=await giphyRequest(query?"search":"trending",query);
    if(seq!==gifRequestSeq)return;
    drawGifResults(data.data||[]);
  }catch(e){if(seq===gifRequestSeq)el.innerHTML=`<div class="gif-note">${esc(e.message||"Could not load GIFs")}</div>`}
}
function openGifStore(){
  if(!S.chat)return;
  $("#gifStore").classList.add("show");

  loadGifs("");
}
function closeGifStore(){$("#gifStore").classList.remove("show");clearTimeout(gifSearchTimer)}
async function sendGif(item){
  const url=gifUrlOf(item);
  if(!url)return;
  const preview=gifPreviewOf(item)||url;
  try{
    await send({type:"gif",url,mime:"image/gif",name:"GIF",gifProvider:"giphy",gifId:item.id||"",preview});

  }catch(e){toast("Could not send GIF: "+(e.message||e))}
}

async function runAuto(){
  if(!autoAct||pc||!S.me)return;

  let i=S.inc;

/* ===== VOICE NOTES ===== */

  let rec = null;
  
async function mic(){
  if(rec){
    if(rec.state!=="inactive") rec.stop();
    return;
  }

  let st,ctx;

  try{
    st=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false,
        channelCount:1,
        sampleRate:48000
      }
    });

    const types=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4"
    ];

    const mime=types.find(t=>MediaRecorder.isTypeSupported(t));

    const opts={
      audioBitsPerSecond:160000
    };

    if(mime) opts.mimeType=mime;

    let rs=st;  /* what gets recorded */
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume?.();
      const src=ctx.createMediaStreamSource(st),dest=ctx.createMediaStreamDestination();
      const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=85;  /* removes rumble and handling thumps */
      const warm=ctx.createBiquadFilter();warm.type="peaking";warm.frequency.value=180;warm.Q.value=.8;warm.gain.value=3;  /* body, so it sounds close instead of distant */
      const air=ctx.createBiquadFilter();air.type="highshelf";air.frequency.value=4500;air.gain.value=2.5;  /* clarity */
      const comp=ctx.createDynamicsCompressor();comp.threshold.value=-30;comp.knee.value=20;comp.ratio.value=3.5;comp.attack.value=.006;comp.release.value=.2;  /* evens out quiet and loud words */
      const gain=ctx.createGain();gain.gain.value=2.4;  /* makeup volume */
      const lim=ctx.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.08;  /* no clipping */
      src.connect(hp);hp.connect(warm);warm.connect(air);air.connect(comp);comp.connect(gain);gain.connect(lim);lim.connect(dest);
      rs=dest.stream;
    }catch{try{ctx?.close()}catch{}ctx=null;rs=st}  /* if WebAudio fails, record the plain mic */
    const recorder=new MediaRecorder(rs,opts);
    const ch=[];

    rec=recorder;

    recorder.ondataavailable=e=>{
      if(e.data.size) ch.push(e.data);
    };

    recorder.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());try{ctx?.close()}catch{}

      if(rec===recorder) rec=null;

      $("#mic")?.classList.remove("recording");

      try{
        if(!ch.length){
          toast("No audio recorded");
          return;
        }

        const type=recorder.mimeType||"audio/webm";
        const ext=type.includes("mp4")?"m4a":"webm";

        toast("Sending…");

        const file=new File(
          ch,
          `voice.${ext}`,
          {type}
        );

        const r=await upload(file);

        await send({
          url:r.url,
          mime:type,
          name:"Voice note"
        });

      }catch(e){
        toast(e.message);
      }
    };

    recorder.start();  /* one continuous recording, no chunk joins */
    $("#mic").classList.add("recording");

  }catch(e){
    st?.getTracks().forEach(t=>t.stop());try{ctx?.close()}catch{}
    rec=null;
    toast("Microphone blocked");
  }
}

/* ===== CALLS (WebRTC, signalling through Firebase: calls/<chatId> and incoming/<uid>) ===== */
let pc=null,ls=null,cid0=null,peer=null,offC=[],ringT=null,CI=null;  /* CI = info about the call in progress (only the CALLER writes call log messages) */
async function postCall(to,c){
  try{
    const me=S.me.uid,cid=cidOf(me,to),t=Date.now(),last={started:"📞 Call started",ended:"📞 Call ended",declined:"📞 Call declined",missed:"📞 Missed call",cancelled:"📞 Call cancelled"}[c.kind];
    await push(ref(db,`chats/${cid}/msgs`),{call:c,from:me,t});
    await update(ref(db),{[`userChats/${me}/${cid}`]:{with:to,last,t,by:me},[`userChats/${to}/${cid}`]:{with:me,last,t,by:me}});
  }catch{}
}
function callUI(t,s,mode){$("#ct").textContent=t;$("#cs").textContent=s;$("#cav").innerHTML=av(peer,"big");$("#cin").style.display=mode==="in"?"flex":"none";$("#cact").style.display=mode==="act"?"flex":"none";$("#cm").classList.add("show")}
async function rtc(video){
  ls=await navigator.mediaDevices.getUserMedia({audio:true,video:!!video});
  pc=new RTCPeerConnection({iceServers:CONFIG.ice});ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  $("#lv").srcObject=ls;
  pc.ontrack=e=>{$("#rv").srcObject=e.streams[0];if(video)$("#grid").style.display="grid"};
  pc.onicecandidate=e=>e.candidate&&push(ref(db,`calls/${cid0}/ice/${S.me.uid}`),e.candidate.toJSON());
  offC.push(onValue(ref(db,`calls/${cid0}/state`),s=>{const v=s.val();if(v==="ended"||v==="declined"){if(CI&&!CI.res)CI.res=v;endCall()}}));
}
const listenIce=()=>offC.push(onChildAdded(ref(db,`calls/${cid0}/ice/${peer}`),s=>pc?.addIceCandidate(s.val()).catch(()=>{})));
async function startCall(video){
  peer=S.chat;cid0=cidOf(S.me.uid,peer);CI={out:true,video:!!video,on:0,res:null};
  try{
    await remove(ref(db,"calls/"+cid0));await rtc(video);callUI(nm(peer),"Calling…","act");
    offC.push(onValue(ref(db,`calls/${cid0}/answer`),async s=>{const a=s.val();if(a&&pc&&!pc.currentRemoteDescription){clearTimeout(ringT);await pc.setRemoteDescription(a);listenIce();callUI(nm(peer),"Connected","act");if(CI&&!CI.on){CI.on=Date.now();postCall(peer,{kind:"started",video:CI.video})}}}));
    await pc.setLocalDescription(await pc.createOffer());
    await update(ref(db,"calls/"+cid0),{from:S.me.uid,video:!!video,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},state:"ringing"});
    await set(ref(db,"incoming/"+peer),{cid:cid0,from:S.me.uid,video:!!video,t:sNow()});
    notifyPeer(peer,"call",(video?"Video":"Voice")+" call",cid0,video);
    clearTimeout(ringT);ringT=setTimeout(()=>{if(pc&&cid0&&!pc.currentRemoteDescription){toast("No answer");if(CI)CI.res="missed";endCall()}},45000);  /* nobody picked up: stop ringing */
  }catch(e){toast("Call failed: "+e.message);CI=null;endCall()}
}
async function answerCall(){
  const i=S.inc;if(!i){endCall();toast("Call ended");return}  /* caller hung up a moment ago */
  peer=i.from;cid0=i.cid;CI=null;ncCancel();
  try{
    await rtc(i.video);
    await pc.setRemoteDescription((await get(ref(db,`calls/${cid0}/offer`))).val());listenIce();
    await pc.setLocalDescription(await pc.createAnswer());
    await update(ref(db,"calls/"+cid0),{answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},state:"active"});
    remove(ref(db,"incoming/"+S.me.uid));callUI(nm(peer),"Connected","act");
  }catch(e){toast("Call failed: "+e.message);endCall()}
}
function endCall(quiet,state){
  clearTimeout(ringT);ncCancel();
  const c=cid0,ci=CI,pe=peer;cid0=null;CI=null;
  offC.forEach(f=>f());offC=[];pc?.close();pc=null;ls?.getTracks().forEach(t=>t.stop());ls=null;
  $("#cm").classList.remove("show");$("#grid").style.display="none";
  if(c&&!quiet){update(ref(db,"calls/"+c),{state:state||"ended"});if(peer)remove(ref(db,"incoming/"+peer));if(S.me)remove(ref(db,"incoming/"+S.me.uid))}
  if(c&&!quiet&&ci?.out&&pe)postCall(pe,{kind:ci.on?"ended":ci.res==="declined"?"declined":ci.res==="missed"?"missed":"cancelled",video:ci.video,dur:ci.on?Math.round((Date.now()-ci.on)/1000):0});
}

    $("#vc").innerHTML=vpHTML(m,true);const v=$("#vc video");
    v.addEventListener("loadedmetadata",()=>{v.currentTime=t;v.play().catch(()=>{})},{once:true});
    $("#viewer").classList.add("show");
  },
  jump:e=>{const b=$(`.mr[data-id="${e.dataset.id}"] .b`);if(b){b.scrollIntoView({block:"center",behavior:"smooth"});b.classList.add("hl");setTimeout(()=>b.classList.remove("hl"),1500)}else toast("Message not found")},
  /* viewer */
  view:e=>{
    const m=msgOf(e.dataset.id),k=kindOf(m),v=$("#vc");S.vm=m;
    if(k==="image")v.innerHTML=`<img src="${esc(m.url)}">`;
    else if(k==="pdf")v.innerHTML=`<iframe src="${esc(m.url)}"></iframe>`;
    else if(k==="txt"){v.innerHTML='<pre>Loading…</pre>';fetch(m.url).then(r=>r.text()).then(t=>v.innerHTML="<pre>"+esc(t.slice(0,30000))+"</pre>")}
    else return download(m);
    $("#viewer").classList.add("show");
  },
  closeview:()=>{$("#viewer").classList.remove("show");$("#vc").innerHTML=""},
  dl:()=>{const m=$("#viewer").classList.contains("show")?S.vm:msgOf(S.menu);hideMenu();if(m)download(m)},
  /* calls */
  call:e=>startCall(e.dataset.v==="1"),
  canswer:answerCall,
  cdecline:()=>{if(S.inc){cid0=S.inc.cid;peer=S.inc.from}endCall(false,"declined")},
  cend:()=>endCall()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el)A[el.dataset.act]?.(el,e)});
/* ===== BACK BUTTON: closes the top-most thing; leaves the app only from the home list ===== */
const showing=q=>$(q)?.classList.contains("show");
function fpBack(){  /* background screen: ask only if something changed */
  const u=S.fp;if(!u||!S.bgd)return A.fpclose();
  if(JSON.stringify(cleanBg(S.set.bg?.[u]))===JSON.stringify(cleanBg(S.bgd)))A.fpclose();else $("#sm").classList.add("show");
}
function goBack(){  /* true = handled something, false = already home */
  if(showing("#cm"))return true;  /* during a call: ignore */
  if(showing("#sm")){$("#sm").classList.remove("show");return true}
  if(showing("#dm")){A.dno();return true}
  if(showing("#pm")){A.pclose();return true}
  if(showing("#menu")){hideMenu();return true}
  if(showing("#viewer")){A.closeview();return true}  /* full-screen file -> the chat / Moments it came from */
  if(showing("#fp")){fpBack();return true}
  if(showing("#th")){A.thclose();return true}
  if(S.me&&S.chat){A.back();return true}  /* chat -> home */
  if(S.me&&S.page!=="chats"){S.page="chats";draw();return true}  /* Moments / Profile -> home */
  return false;
}
window.appBack=()=>{try{return goBack()}catch{return false}};  /* the Android activity can call this: true = handled, false = at home */
const APP=NAT?(CAP.Plugins?.App||CAP.registerPlugin?.("App")):null;
try{APP?.addListener?.("backButton",()=>{if(!goBack())APP.exitApp?.()})?.catch?.(()=>{})}catch{}
/* fallback when the App plugin is missing: Android back pops browser history, we catch it and put a marker back */
const sentinel=()=>{if(!history.state?.s)history.pushState({s:1},"")};
sentinel();document.addEventListener("click",sentinel,true);
window.addEventListener("popstate",()=>{if(goBack())sentinel();else toast("Press back again to exit")});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="txt")A.send();if(e.key==="Enter"&&e.target.id==="thi")A.thsend()});
/* Acode's preview may not shrink visualViewport when Android opens the keyboard.
   Use input focus as the reliable fallback; on a phone, focusing the chat box opens the keyboard. */
function updateGifButton(){
  const input=$("#txt"),btn=$("#gifBtn");
  if(!input||!btn)return;
  const focused=document.activeElement===input;
  const vv=window.visualViewport;
  const viewportShrunk=!!vv && vv.height < Math.min(window.innerHeight,window.screen.height||window.innerHeight)*0.78;
  // If the WebView reports keyboard resizing, respect it. If it does not, fall back to focus.
  const keyboardVisible=viewportShrunk || !vv || !window.__visualViewportResizeObserved;
  btn.classList.toggle("show",focused&&keyboardVisible);
}
window.__visualViewportResizeObserved=false;
window.visualViewport?.addEventListener("resize",()=>{
  window.__visualViewportResizeObserved=true;
  updateGifButton();
});
document.addEventListener("focusin",e=>{if(e.target.id==="txt")setTimeout(updateGifButton,80)});
document.addEventListener("focusout",e=>{if(e.target.id==="txt")setTimeout(updateGifButton,180)});
window.visualViewport?.addEventListener("scroll",updateGifButton);
window.addEventListener("resize",updateGifButton);
document.addEventListener("input",e=>{
  if(e.target.id!=="gifQuery")return;
  clearTimeout(gifSearchTimer);
  const q=e.target.value.trim();
  gifSearchTimer=setTimeout(()=>{if(q===gifLastQuery)return;gifLastQuery=q;loadGifs(q)},650);
});

/* drag the PNG inside the preview bubble to move it */
let dg=null;
document.addEventListener("pointerdown",e=>{const k=e.target.closest("#bprev .stk");if(k){dg=k;k.setPointerCapture(e.pointerId);e.preventDefault()}});
document.addEventListener("pointermove",e=>{
  if(!dg)return;const r=dg.parentElement.getBoundingClientRect();
  const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
  dg.style.left=x+"%";dg.style.top=y+"%";dg.dataset.x=x;dg.dataset.y=y;
});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{
  if(!dg)return;const g=dg.dataset.g;
  if(dg.dataset.x)putG(g,{...getG(g),ix:Math.round(dg.dataset.x),iy:Math.round(dg.dataset.y)});
  dg=null;
}));
document.addEventListener("input",e=>{
  const k=e.target.dataset?.bs;if(!k)return;
  const [g,f]=k.split(".");S.set=S.set||{};
  const v=e.target.type==="range"?+e.target.value:e.target.value;if(f)setLocal(g,{...getG(g),[f]:v});else S.set.r=v;
  bubPrev();saveB(g);
});
document.addEventListener("input",e=>{const f=e.target.dataset?.bg;if(!f||!S.bgd)return;S.bgd[f]=e.target.type==="range"?+e.target.value:e.target.value;bgPrev()});
/* drag the preview to move the background image */
let bd=null;
document.addEventListener("pointerdown",e=>{
  const p=e.target.closest("#bgprev");if(!p||!S.bgd||S.bgd.mode!=="img"||!S.bgd.img)return;
  const r=p.getBoundingClientRect();bd={sx:e.clientX,sy:e.clientY,x:S.bgd.x,y:S.bgd.y,w:r.width,h:r.height};p.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener("pointermove",e=>{if(!bd)return;S.bgd.x=Math.round((bd.x+(e.clientX-bd.sx)/bd.w*100)*10)/10;S.bgd.y=Math.round((bd.y+(e.clientY-bd.sy)/bd.h*100)*10)/10;bgPrev()});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{bd=null}));
document.addEventListener("change",e=>{if(e.target.id==="baud"){flushB();S.aud=e.target.value;keep(draw)}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim().toLowerCase();fill()}});
/* long-press (or right-click) a bubble to open the menu */
let pt;
let sx=0,sy=0,sr=null,sd=0;
document.addEventListener("touchstart",e=>{
  if(e.target.closest(".vpbar"))return;
  lpHit=false;
  const b=e.target.closest(".b");if(b)pt=setTimeout(()=>{sr=null;showMenu(b)},450);
  const it=!S.chat&&e.target.closest(".item[data-cid]");
  if(it&&S.chats[it.dataset.cid]){const c=it.dataset.cid;pt=setTimeout(()=>{lpHit=true;askDelChat(c)},500)}
  const r=e.target.closest(".mr");if(r&&!r.classList.contains("cx")&&!e.target.closest("audio")){sr=r;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sd=0}
},{passive:true});
/* swipe a message to the right to reply */
document.addEventListener("touchmove",e=>{if(!sr)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(!sd&&Math.abs(dy)>Math.abs(dx)){sr=null;return}sd=Math.max(0,Math.min(dx,70));sr.style.transform=sd?`translateX(${sd}px)`:""},{passive:true});
document.addEventListener("touchend",()=>{if(!sr)return;if(sd>=55){const m=msgOf(sr.dataset.id);if(m)startReply(m)}sr.style.transform="";sr=null},{passive:true});
["touchend","touchmove","touchcancel"].forEach(t=>document.addEventListener(t,()=>clearTimeout(pt),{passive:true}));
document.addEventListener("contextmenu",e=>{
  const b=e.target.closest(".b");if(b){e.preventDefault();showMenu(b);return}
  const it=!S.chat&&e.target.closest(".item[data-cid]");if(it&&S.chats[it.dataset.cid]){e.preventDefault();lpHit=true;askDelChat(it.dataset.cid)}
});
/* video player: tap = play/pause, drag the thin line to seek */
for(const ev of["timeupdate","play","pause","ended"])document.addEventListener(ev,e=>{
  const v=e.target;if(v.tagName!=="VIDEO")return;const p=v.closest(".vp");if(!p)return;
  p.classList.toggle("paused",v.paused);
  p.querySelector(".vpfill").style.width=(v.duration?v.currentTime/v.duration*100:0)+"%";
},true);
/* only one thing plays at a time: starting any video or voice note pauses the rest */
document.addEventListener("play",e=>{
  const t=e.target;if(!["VIDEO","AUDIO"].includes(t.tagName)||t.closest("#cm"))return;
  document.querySelectorAll(".vp video,audio").forEach(o=>o!==t&&o.pause());
},true);
let sk=null;
const seek=e=>{const r=sk.getBoundingClientRect(),v=sk.closest(".vp").querySelector("video");if(v.duration)v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".vpbar");if(b){sk=b;b.setPointerCapture(e.pointerId);b.closest(".vp").classList.add("drag");seek(e)}});
document.addEventListener("pointermove",e=>{if(sk)seek(e)});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{if(sk){sk.closest(".vp").classList.remove("drag");sk=null}}));
document.addEventListener("change",async e=>{
  const f=e.target.files?.[0];if(!f)return;const id=e.target.id;e.target.value="";
  try{
    if(id==="pfile"){S.pf=f;$("#pname").textContent=f.name;return}
    const r=await upload(f);
    if(id==="file")await send({url:r.url,type:r.type,mime:r.mime,name:r.name});
    if(id==="afile")await update(ref(db,"users/"+S.me.uid),{photo:r.url});
    if(id==="bgf"){
      if(r.type!=="image")return toast("Pick an image");
      const url=r.url.includes("/image/upload/")?r.url.replace("/image/upload/","/image/upload/w_1400,q_auto/"):r.url,im=new Image();
      im.onload=()=>{if(!S.bgd)return;  /* start zoomed so the picture covers the whole chat */
        S.bgd={...S.bgd,mode:"img",img:url,x:50,y:50,z:Math.round(Math.max(100,100*(im.naturalWidth/im.naturalHeight)/(S.ar||.6))),dim:S.bgd.dim||0};bgRender()};
      im.onerror=()=>toast("Could not load the image");im.src=url;
    }
    if(id==="bpngf"){const g=S.bg;putG(g,{...getG(g),img:r.url,ix:50,iy:50,is:40,ir:0});keep(draw)}
  }catch(x){toast(x.message)}
});
</script>

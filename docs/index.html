<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>Us</title>
<style>
/* ===== 1. COLORS & SIZES: change these first ===== */
:root{
  --bg:#0b0811;       /* page background */
  --card:#17121f;     /* cards, bars */
  --card2:#221b2d;    /* inputs, buttons */
  --line:#ffffff12;   /* thin borders */
  --txt:#f5f0f8;      /* main text */
  --mut:#8c8296;      /* faded text */
  --acc:#7289da;      /* main accent */
  --acc2:#5b6eae;     /* darker accent */
  --bad:#ff6b81;      /* red: badges, likes, delete */
  --ok:#2ecc71;       /* green: answer call */
  --radius:16px;
  --bubble:#1d1628;                                      /* received bubble */
  --me-bubble:linear-gradient(135deg,#5b6eae,#7289da);   /* sent bubble */
}
/* ===== 2. BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .center{text-align:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
.hint{text-align:center;color:var(--mut);padding:30px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ===== 3. LAYOUT: top bar, scroll area, bottom nav ===== */
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:58px;border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:17px;min-width:0}
.view{flex:1;overflow:auto;min-height:0}
.pad{max-width:640px;margin:0 auto;padding:16px}
.nav{display:flex;background:#08060d;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:9px 0 7px;font-size:11px;color:var(--mut);position:relative}
.nav .on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
/* ===== 4. BUTTONS & INPUTS ===== */
.btn{background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff;font-weight:650;border-radius:14px;padding:12px 18px}
.btn.soft{background:var(--card2)} .btn.full{width:100%} .btn.sm{padding:8px 14px;font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.ib.acc{background:var(--acc)}
.ib.recording{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
/* ===== 5. AVATARS (size classes: sm, big) ===== */
.av{--h:220;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;font-weight:650;background:hsl(var(--h) 45% 32%);color:hsl(var(--h) 80% 90%)}
.av.sm{width:32px;height:32px;font-size:14px} .av.big{width:92px;height:92px;font-size:38px}
.av img{width:100%;height:100%;object-fit:cover}
/* ===== 6. CHAT: rows, bubbles, media, replies ===== */
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.mr{display:flex;flex-direction:column;align-items:flex-start;touch-action:pan-y;transition:transform .12s}
.mr.me{align-items:flex-end}
.b{width:fit-content;max-width:min(86%,340px);padding:9px 13px;background:var(--bubble);border-radius:18px 18px 18px 6px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.b img{-webkit-user-drag:none}
.b.me{background:var(--me-bubble);color:#fff;border-radius:18px 18px 6px 18px}
.b.hl{outline:2px solid var(--acc)}
.b.media{background:none;padding:0;border-radius:0}  /* files with no text: no bubble */
.b.media .fc{background:var(--card2)}
.mt{font-size:10.5px;color:var(--mut);margin-top:3px;padding:0 2px}
.pic{display:block;max-width:100%;max-height:360px;border-radius:14px;background:var(--card2)}
/* video player: no browser controls, only a thin seek line */
.vp{position:relative;display:inline-block;line-height:0;border-radius:14px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.vp video{display:block;width:auto;height:auto;max-width:min(86vw,340px);max-height:360px}
.vp.big{border-radius:8px} .vp.big video{max-width:100vw;max-height:calc(100dvh - 140px)}
.vpplay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .15s}
.vpplay span{width:54px;height:54px;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;font-size:22px;padding-left:4px}
.vp:not(.paused) .vpplay{opacity:0}
.vpbar{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:flex-end;touch-action:none}
.vptrack{width:100%;height:3px;background:#ffffff45} .vp.drag .vptrack{height:8px}
.vpfill{height:100%;width:0;background:var(--acc)}
.b audio{width:230px;max-width:100%;height:38px;display:block;filter:invert(.9) hue-rotate(190deg)}
.fc{display:flex;gap:8px;align-items:center;padding:9px;background:#ffffff12;border-radius:12px;cursor:pointer}
.rq{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;margin-bottom:6px;background:#00000030;border-left:3px solid var(--acc);border-radius:6px;font-size:12px;cursor:pointer;overflow:hidden}
.rqt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rth{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:#000;display:block}  /* mini picture / video frame in replies */
.rth.ico{display:grid;place-items:center;background:var(--card2);font-size:18px}
.rp{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);border-left:3px solid var(--acc);font-size:13px}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer input{border-radius:22px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pip{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
/* ===== 7. POP-UPS: viewer, long-press menu, delete box, call ===== */
.viewer{position:fixed;inset:0;z-index:100;background:#08070cf5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:64px 12px 20px}
.viewer.show{display:flex}
#vc{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#vc img,#vc video{max-width:100%;max-height:100%;border-radius:8px}
#vc iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}
#vc pre{width:100%;max-width:600px;height:100%;overflow:auto;margin:0;padding:16px;background:var(--card);border-radius:12px;white-space:pre-wrap;font-size:13px}
.viewer .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px}
.viewer .dl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px}
.ov{position:fixed;inset:0;z-index:110;display:none}.ov.show{display:block}
.menu{position:fixed;z-index:120;display:none;background:#251d30;border:1px solid #ffffff22;border-radius:16px;padding:6px;min-width:160px;box-shadow:0 10px 40px #0009}
.menu.show{display:block}
.menu button{display:block;width:100%;padding:11px 13px;border-radius:10px;text-align:left}
.menu button:active{background:#ffffff15} .menu .del{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:200;background:#00000080;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;text-align:center}
.modal h2{margin:10px 0 6px;font-size:20px} .modal p{color:var(--mut);margin:0 0 18px}
.btns{display:flex;gap:10px}.btns button{flex:1;padding:12px;border-radius:14px;font-weight:650;color:#fff}
.no{background:var(--card2)} .red{background:var(--bad)} .green{background:var(--ok)}
#grid{display:none;gap:10px;margin-bottom:16px}
#grid video{width:100%;height:180px;object-fit:cover;background:#000;border-radius:14px}
.thread{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.thread.show{display:flex}
.cm{margin-top:12px;padding-left:10px;border-left:2px solid var(--line)}
.cm button{color:var(--mut);padding:2px 0;margin-right:10px}
.pk{flex:1;font-size:12px;color:var(--mut)}
.pk select option{background:var(--card2);color:var(--txt)}
.pk select{width:100%;height:42px;margin-top:4px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;outline:none}
.pk input{height:38px;padding:2px;margin-top:4px;border-radius:10px}
.b{position:relative}
.msgs{overflow-x:hidden}
.stk{position:absolute;pointer-events:none;max-width:none;z-index:2}
.pv .stk{pointer-events:auto;cursor:grab;touch-action:none}
/* ===== 8. FEED, LOGIN, TOAST ===== */
.act{display:flex;gap:8px}
.act button{display:flex;gap:6px;align-items:center;margin-top:10px;padding:6px 12px;border-radius:18px;background:var(--card2);color:var(--mut)}
.act button.on{color:var(--bad)} .act button.on svg{fill:var(--bad)}
.auth{max-width:420px;margin:auto;padding:8vh 22px}
.logo{font-size:46px;font-weight:700;letter-spacing:-2px} .logo b{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;padding:10px;border-radius:11px;color:var(--mut)} .seg .on{background:var(--bg);color:var(--txt)}
.auth input{margin-bottom:10px} .err{color:var(--bad);min-height:20px;font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b2433;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- full-screen media viewer -->
<div class="viewer" id="viewer"><button class="btn sm dl" data-act="dl">Download</button><button class="ib x" data-act="closeview">✕</button><div id="vc"></div></div>
<!-- discussion thread -->
<div class="thread" id="th"></div>
<!-- long-press menu -->
<div class="ov" id="ov" data-act="closemenu"></div>
<div class="menu" id="menu"><button data-act="reply">↩ Reply</button><button data-act="copy">📋 Copy</button><button data-act="dl" id="mdl">⬇ Download</button><button class="del" data-act="del" id="mdel">⌫ Delete</button></div>
<!-- delete box -->
<div class="modal" id="dm"><div class="box"><h2 id="dh">Delete for both?</h2><p id="dp">This can't be undone.</p><div class="btns"><button class="no" data-act="dno">No</button><button class="red" data-act="dyes">Yes</button></div></div></div>
<!-- call box -->
<div class="modal" id="cm" style="z-index:250;background:#08070cf8"><div class="box"><div id="cav"></div><h2 id="ct">Call</h2><p id="cs"></p>
  <div id="grid"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video></div>
  <div class="btns" id="cin"><button class="red" data-act="cdecline">Decline</button><button class="green" data-act="canswer">Answer</button></div>
  <div class="btns" id="cact"><button class="red" data-act="cend">End call</button></div></div></div>

<script type="module">
/* ===== CONFIG ===== */
const CONFIG={
  firebase:{apiKey:"AIzaSyAi27biKcUGvCB4kXsXEdgeq85JLBb7a_Y",authDomain:"library-a60e3.firebaseapp.com",databaseURL:"https://library-a60e3-default-rtdb.firebaseio.com",projectId:"library-a60e3",storageBucket:"library-a60e3.firebasestorage.app",messagingSenderId:"933820691428",appId:"1:933820691428:web:25dcddcfc078ac910acdf1"},
  cloudinary:{cloudName:"dwf9uonlj",uploadPreset:"our_chat"},
  ice:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}]
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getDatabase,ref,set,get,push,update,remove,onValue,onChildAdded,query,limitToLast} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
const fb=initializeApp(CONFIG.firebase),auth=getAuth(fb),db=getDatabase(fb);

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',heart:'<path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',clip:'<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>',back:'<path d="M15 5l-7 7 7 7"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',vid:'<rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const hue=n=>{let h=0;for(const c of String(n||"?"))h=(h*31+c.codePointAt(0))%360;return h};
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const when=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?fmtT(t):d.toLocaleDateString([],{month:"short",day:"numeric"})+", "+fmtT(t)};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("show"),2500)};
const nm=u=>S.users[u]?.name||"Someone";
const av=(u,c="")=>{const p=S.users[u]||{};return p.photo?`<span class="av ${c}"><img src="${esc(p.photo)}" alt=""></span>`:`<span class="av ${c}" style="--h:${hue(p.name)}">${esc((p.name||"?")[0].toUpperCase())}</span>`};
const cidOf=(a,b)=>[a,b].sort().join("_");
const kindOf=m=>{if(!m.url)return"msg";const t=m.mime||"";return t.startsWith("image")||m.type==="image"?"image":t.startsWith("video")||m.type==="video"?"video":t.startsWith("audio")?"audio":t==="application/pdf"?"pdf":t.startsWith("text")?"txt":"file"};
async function upload(file){
  const f=new FormData();f.append("file",file);f.append("upload_preset",CONFIG.cloudinary.uploadPreset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/auto/upload`,{method:"POST",body:f}),j=await r.json();
  if(!j.secure_url)throw new Error(j.error?.message||"Upload failed");
  return {url:j.secure_url,type:j.resource_type,mime:file.type||"",name:file.name};
}
async function download(m){
  try{const b=await (await fetch(m.url)).blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=m.name||"file";a.click()}
  catch{window.open(m.url,"_blank")}
}

/* ===== STATE: S.chat = uid of open chat, S.page = chats | feed | me, S.reply = message being replied to ===== */
const S={me:null,mode:"in",page:"chats",chat:null,q:"",users:{},chats:{},reads:{},posts:[],likes:{},msgs:[],pf:null,reply:null,menu:null,inc:null,mom:{},th:null,cr:null,pdel:null,set:{},bub:{},bto:{},aud:"all"};
const isUnread=(c,v)=>v.by!==S.me.uid&&v.t>(S.reads[c]||0);
const msgOf=id=>S.msgs.find(m=>m.id===id)||allMoments().find(m=>m.id===id);

/* ===== LIVE DATA ===== */
let offs=[],offMsgs=()=>{},momOffs={};
function syncMoms(){Object.keys(S.chats).forEach(c=>{if(!momOffs[c])momOffs[c]=onValue(ref(db,"moments/"+c),s=>{S.mom[c]=s.val()||{};fill()})})}
const watch=(path,fn,q)=>{const r=ref(db,path);offs.push(onValue(q?q(r):r,s=>{fn(s.val()||{});fill()}))};
onAuthStateChanged(auth,u=>{
  offs.forEach(f=>f());offs=[];offMsgs();endCall(true);Object.values(momOffs).forEach(f=>f());momOffs={};S.mom={};S.th=null;$("#th").classList.remove("show");S.me=u;S.chat=null;S.reply=null;
  if(u){
    update(ref(db,"users/"+u.uid),{name:u.displayName||u.email.split("@")[0]});
    try{if(!localStorage.getItem("permAsked")){localStorage.setItem("permAsked","1");askPerms()}}catch{}
    watch("users",v=>S.users=v);
    watch("userChats/"+u.uid,v=>{S.chats=v;syncMoms()});
    watch("reads/"+u.uid,v=>S.reads=v);
    watch("likes",v=>S.likes=v);
    watch("settings/"+u.uid,v=>S.set=v);
    watch("bubbles",v=>S.bub=v);
    watch("bubblesTo/"+u.uid,v=>S.bto=v);
    watch("posts",v=>S.posts=Object.entries(v).map(([id,p])=>({id,...p})).sort((a,b)=>b.t-a.t),r=>query(r,limitToLast(50)));
    watch("incoming/"+u.uid,v=>{S.inc=v.cid?v:null;if(S.inc&&!pc){peer=v.from;callUI(nm(v.from),(v.video?"Video":"Voice")+" call…","in")}else if(!S.inc&&!pc)$("#cm").classList.remove("show")});
  }
  draw();
});
function openChat(uid){
  if(uid===S.me.uid)return;
  S.chat=uid;S.msgs=[];S.reply=null;const cid=cidOf(S.me.uid,uid);
  offMsgs=onValue(query(ref(db,`chats/${cid}/msgs`),limitToLast(100)),s=>{
    S.msgs=Object.entries(s.val()||{}).map(([id,m])=>({id,...m})).sort((a,b)=>a.t-b.t);
    set(ref(db,`reads/${S.me.uid}/${cid}`),Date.now());fill();
  });
  draw();
}
async function send(m){
  const me=S.me.uid,cid=cidOf(me,S.chat),t=Date.now();
  if(S.reply){m.reply=S.reply;S.reply=null;rbar()}
  await push(ref(db,`chats/${cid}/msgs`),{...m,from:me,t});
  if(m.url)await push(ref(db,`moments/${cid}`),{uid:me,url:m.url,mime:m.mime||"",type:m.type||"",name:m.name||"",t});
  const last=m.text||{image:"📷 Photo",audio:"🎤 Voice note",video:"🎬 Video"}[kindOf(m)]||"📎 File";
  await update(ref(db),{[`userChats/${me}/${cid}`]:{with:S.chat,last,t,by:me},[`userChats/${S.chat}/${cid}`]:{with:me,last,t,by:me}});
}

/* ===== SCREENS (HTML) ===== */
/* ===== BUBBLE STYLES: DEF = defaults. c1/c2 = gradient colors, tx = text color, r = roundness ===== */
const DEF={mine:{c1:"#5b6eae",c2:"#7289da",tx:"#ffffff"},theirs:{c1:"#1d1628",c2:"#1d1628",tx:"#f5f0f8"},r:18};
/* publish my bubble instantly: bubbles/<myuid> is readable by everyone, no accepting */
const pub=()=>{const st=S.set||{},p=ref(db,"bubbles/"+S.me.uid);return st.mine||st.r!=null?set(p,{...(st.mine||DEF.mine),r:st.r??DEF.r}):remove(p)};
/* audience: S.aud = "all" (Everyone) or one chat partner's uid. Each has its own bubble:
   Everyone -> settings/me/mine (+ r), published to bubbles/me.  One person -> settings/me/only/uid (r inside), published to bubblesTo/uid/me */
const audOk=()=>S.aud!=="all"&&Object.values(S.chats).some(c=>c.with===S.aud);

const setLocal=(g,x)=>{if(g==="mine"&&audOk())S.set.only={...(S.set.only||{}),[S.aud]:x};else S.set[g]=x};
const sendOnly=u=>{const x=S.set.only?.[u];if(x){update(ref(db,`settings/${S.me.uid}/only`),{[u]:x});set(ref(db,`bubblesTo/${u}/${S.me.uid}`),x)}};
const putG=(g,x)=>{  /* save + go live now */
  const u=g==="mine"&&audOk()?S.aud:0;setLocal(g,x);
  if(u)sendOnly(u);else{update(ref(db,"settings/"+S.me.uid),{[g]:x});if(g==="mine")pub()}
};
const keep=f=>{const v=$(".view"),y=v?v.scrollTop:0;f();const n=$(".view");if(n)n.scrollTop=y};  /* redraw without jumping to the top */
let bsT,bsP=null,bsK="";
const flushB=()=>{clearTimeout(bsT);const f=bsP;bsP=null;f&&f()};
const saveB=g=>{  /* debounced save while dragging sliders */
  const u=g==="mine"&&audOk()?S.aud:0,k=u||g;if(bsP&&bsK!==k)flushB();bsK=k;clearTimeout(bsT);
  bsP=()=>{if(u)sendOnly(u);else{update(ref(db,"settings/"+S.me.uid),{[g]:S.set[g]});pub()}};
  bsT=setTimeout(flushB,400);
};

/* ===== PERMISSIONS: the first login asks Android for microphone + camera (Capacitor shows the system dialogs) ===== */
async function askPerms(){
  for(const c of [{audio:true},{video:true}]){try{(await navigator.mediaDevices.getUserMedia(c)).getTracks().forEach(t=>t.stop())}catch{}}
}
/* ===== VOICE NOTES ===== */
let rec=null;
async function mic(){
  if(rec){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);
    rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());rec=null;$("#mic")?.classList.remove("recording");
      try{toast("Sending…");const r=await upload(new File(ch,"voice.webm",{type:"audio/webm"}));await send({url:r.url,mime:"audio/webm",name:"Voice note"})}catch(e){toast(e.message)}
    };
    rec.start();$("#mic").classList.add("recording");
  }catch{toast("Microphone blocked")}
}

/* ===== CALLS (WebRTC, signalling through Firebase: calls/<chatId> and incoming/<uid>) ===== */
let pc=null,ls=null,cid0=null,peer=null,offC=[];
function callUI(t,s,mode){$("#ct").textContent=t;$("#cs").textContent=s;$("#cav").innerHTML=av(peer,"big");$("#cin").style.display=mode==="in"?"flex":"none";$("#cact").style.display=mode==="act"?"flex":"none";$("#cm").classList.add("show")}
async function rtc(video){
  ls=await navigator.mediaDevices.getUserMedia({audio:true,video:!!video});
  pc=new RTCPeerConnection({iceServers:CONFIG.ice});ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  $("#lv").srcObject=ls;
  pc.ontrack=e=>{$("#rv").srcObject=e.streams[0];if(video)$("#grid").style.display="grid"};
  pc.onicecandidate=e=>e.candidate&&push(ref(db,`calls/${cid0}/ice/${S.me.uid}`),e.candidate.toJSON());
  offC.push(onValue(ref(db,`calls/${cid0}/state`),s=>{if(s.val()==="ended")endCall()}));
}
const listenIce=()=>offC.push(onChildAdded(ref(db,`calls/${cid0}/ice/${peer}`),s=>pc?.addIceCandidate(s.val()).catch(()=>{})));
async function startCall(video){
  peer=S.chat;cid0=cidOf(S.me.uid,peer);
  try{
    await remove(ref(db,"calls/"+cid0));await rtc(video);callUI(nm(peer),"Calling…","act");
    offC.push(onValue(ref(db,`calls/${cid0}/answer`),async s=>{const a=s.val();if(a&&!pc.currentRemoteDescription){await pc.setRemoteDescription(a);listenIce();callUI(nm(peer),"Connected","act")}}));
    await pc.setLocalDescription(await pc.createOffer());
    await update(ref(db,"calls/"+cid0),{from:S.me.uid,video:!!video,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},state:"ringing"});
    await set(ref(db,"incoming/"+peer),{cid:cid0,from:S.me.uid,video:!!video});
  }catch(e){toast("Call failed: "+e.message);endCall()}
}
async function answerCall(){
  const i=S.inc;peer=i.from;cid0=i.cid;
  try{
    await rtc(i.video);
    await pc.setRemoteDescription((await get(ref(db,`calls/${cid0}/offer`))).val());listenIce();
    await pc.setLocalDescription(await pc.createAnswer());
    await update(ref(db,"calls/"+cid0),{answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},state:"active"});
    remove(ref(db,"incoming/"+S.me.uid));callUI(nm(peer),"Connected","act");
  }catch(e){toast("Call failed: "+e.message);endCall()}
}
function endCall(quiet){
  const c=cid0;cid0=null;
  offC.forEach(f=>f());offC=[];pc?.close();pc=null;ls?.getTracks().forEach(t=>t.stop());ls=null;
  $("#cm").classList.remove("show");$("#grid").style.display="none";
  if(c&&!quiet){update(ref(db,"calls/"+c),{state:"ended"});if(peer)remove(ref(db,"incoming/"+peer));if(S.me)remove(ref(db,"incoming/"+S.me.uid))}
}

/* ===== ACTIONS: every button has data-act="name" and runs A.name ===== */
const hideMenu=()=>{$("#menu").classList.remove("show");$("#ov").classList.remove("show")};
function showMenu(b){
  const id=b.closest("[data-id]").dataset.id,m=msgOf(id);if(!m)return;S.menu=id;
  $("#mdl").style.display=m.url?"block":"none";$("#mdel").style.display=m.from===S.me.uid?"block":"none";
  const r=b.getBoundingClientRect(),mn=$("#menu");
  mn.style.top=Math.max(70,Math.min(r.bottom+6,innerHeight-200))+"px";mn.style.left=Math.max(8,Math.min(r.left,innerWidth-180))+"px";
  mn.classList.add("show");$("#ov").classList.add("show");navigator.vibrate?.(20);
}
let lastTap=0,lastEl=null;
const A={
  mode:e=>{S.mode=e.dataset.m;draw()},
  nav:e=>{S.page=e.dataset.p;draw()},
  open:e=>openChat(e.dataset.uid),
  back:()=>{offMsgs();S.chat=null;S.reply=null;draw()},
  attach:()=>$("#file").click(), pickimg:()=>$("#pfile").click(), avatar:()=>$("#afile").click(),
  logout:()=>signOut(auth),
  send:()=>{const i=$("#txt"),t=i.value.trim();if(t){i.value="";send({text:t})}},
  mic,
  saveprof:async()=>{
    const name=$("#unm").value.trim(),bio=$("#ubio").value.trim().slice(0,160);
    if(name.length<2)return toast("Username needs at least 2 characters");
    try{await updateProfile(auth.currentUser,{displayName:name});await update(ref(db,"users/"+S.me.uid),{name,bio});toast("Saved");draw()}catch(e){toast(e.message)}
  },
  bpng:e=>{S.bg=e.dataset.g;$("#bpngf").click()},
  bpngx:e=>{const g=e.dataset.g,x={...getG(g)};["img","ix","iy","is","ir"].forEach(k=>delete x[k]);putG(g,x);keep(draw)},
  gsave:()=>{const m=getG("mine"),x={};["c1","c2","tx","pl","pr","img","ix","iy","is","ir"].forEach(k=>{if(m[k]!=null)x[k]=m[k]});x.r=audOk()?m.r??DEF.r:S.set.r??DEF.r;x.t=Date.now();push(ref(db,`settings/${S.me.uid}/gallery`),x);toast("Saved to gallery")},
  guse:e=>{const it=(S.set.gallery||{})[e.dataset.id];if(!it)return;const {t,r,...st}=it;
    if(audOk())putG("mine",{...st,r:r??DEF.r});
    else{if(r!=null){S.set.r=r;update(ref(db,"settings/"+S.me.uid),{r})}putG("mine",st)}
    keep(draw);toast("Applied")},
  gdel:e=>remove(ref(db,`settings/${S.me.uid}/gallery/${e.dataset.id}`)),
  guseth:()=>{if(!audOk())return;const f=S.bto[S.aud]||S.bub[S.aud];if(!f)return;  /* copy their bubble into MY bubble for this audience (theirs is not touched) */
    const x={};["c1","c2","tx","pl","pr","img","ix","iy","is","ir"].forEach(k=>{if(f[k]!=null)x[k]=f[k]});x.r=f.r??DEF.r;
    putG("mine",x);keep(draw);toast("Copied their bubble")},
  bonlyx:()=>{if(!audOk())return;const u=S.aud,o={...(S.set.only||{})};delete o[u];S.set.only=o;remove(ref(db,`settings/${S.me.uid}/only/${u}`));remove(ref(db,`bubblesTo/${u}/${S.me.uid}`));keep(draw)},
  bsreset:()=>{update(ref(db,"settings/"+S.me.uid),{mine:null,theirs:null,r:null});delete S.set.mine;delete S.set.theirs;delete S.set.r;pub();draw()},
  like:e=>{const id=e.dataset.id;update(ref(db,"likes/"+id),{[S.me.uid]:S.likes[id]?.[S.me.uid]?null:true})},
  post:async()=>{
    const text=$("#ptxt").value.trim();if(!text&&!S.pf)return;
    try{toast("Posting…");const img=S.pf?(await upload(S.pf)).url:"";await push(ref(db,"posts"),{uid:S.me.uid,text,img,t:Date.now()});S.pf=null;draw()}catch(e){toast(e.message)}
  },
  auth:async()=>{
    const em=$("#em").value.trim(),pw=$("#pw").value,name=$("#nm")?.value.trim();
    try{
      if(S.mode==="up"){if(!name)throw{code:"enter your name"};const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:name});await update(ref(db,"users/"+c.user.uid),{name})}
      else await signInWithEmailAndPassword(auth,em,pw);
    }catch(e){$("#err").textContent=String(e.code||e.message).replace("auth/","").replace(/-/g," ")}
  },
  /* replies + menu */
  reply:()=>{const m=msgOf(S.menu);hideMenu();if(m)startReply(m)},
  noreply:()=>{S.reply=null;rbar()},
  copy:()=>{const m=msgOf(S.menu);hideMenu();navigator.clipboard?.writeText(m?.text||m?.url||"");toast("Copied")},
  del:()=>{hideMenu();$("#dh").textContent="Delete for both?";$("#dp").textContent="This can't be undone.";$("#dm").classList.add("show")},
  pdel:e=>{
    const m=allMoments().find(x=>x.id===e.dataset.id);S.pdel=e.dataset.id;
    $("#dh").textContent="Delete from Moments?";
    $("#dp").textContent=m?.cid?"The file and its discussion are removed for both of you. Your chat keeps its copy.":"The post and its discussion disappear for everyone.";
    $("#dm").classList.add("show");
  },
  thread:e=>openThread(e.dataset.id),
  thclose:()=>{S.th=null;S.cr=null;$("#th").classList.remove("show");$("#th").innerHTML=""},
  thsend:async()=>{
    const i=$("#thi"),x=i.value.trim(),m=allMoments().find(y=>y.id===S.th);if(!x||!m)return;
    i.value="";await push(ref(db,mpath(m)+"/comments"),{uid:S.me.uid,text:x,parent:S.cr||"",t:Date.now()});S.cr=null;thBar();
  },
  cr:e=>{S.cr=e.dataset.id;thBar();$("#thi")?.focus()},
  crx:()=>{S.cr=null;thBar()},
  cdel:e=>{  /* deletes this reply and everything under it */
    const m=allMoments().find(x=>x.id===S.th),cs=m?.comments||{},out={};
    const go=id=>{out[mpath(m)+"/comments/"+id]=null;Object.entries(cs).forEach(([k,c])=>c.parent===id&&go(k))};
    go(e.dataset.id);update(ref(db),out);if(out[mpath(m)+"/comments/"+S.cr]===null){S.cr=null;thBar()}
  },
  dno:()=>{S.pdel=null;$("#dm").classList.remove("show")},
  dyes:()=>{
    $("#dm").classList.remove("show");
    if(S.pdel){  /* moment + its discussion + likes; the chat message is NOT touched */
      const id=S.pdel,m=allMoments().find(x=>x.id===id);S.pdel=null;
      if(m)update(ref(db),{[mpath(m)]:null,["likes/"+id]:null});
    }
    else remove(ref(db,`chats/${cidOf(S.me.uid,S.chat)}/msgs/${S.menu}`));
  },
  closemenu:hideMenu,
  /* one tap = play/pause, double tap = full screen (double tap again = back) */
  vptoggle:(el,e)=>{
    if(e.target.closest(".vpbar"))return;
    const now=Date.now(),dbl=lastEl===el&&now-lastTap<300;lastEl=el;lastTap=now;
    if(dbl){lastTap=0;return el.classList.contains("big")?A.closeview():A.vpfull(el)}
    const v=el.querySelector("video");v.paused?v.play():v.pause();
  },
  vpfull:el=>{
    const m=msgOf(el.dataset.id),old=el.closest(".vp").querySelector("video"),t=old.currentTime;old.pause();S.vm=m;
    $("#vc").innerHTML=vpHTML(m,true);const v=$("#vc video");
    v.addEventListener("loadedmetadata",()=>{v.currentTime=t;v.play().catch(()=>{})},{once:true});
    $("#viewer").classList.add("show");
  },
  jump:e=>{const b=$(`.mr[data-id="${e.dataset.id}"] .b`);if(b){b.scrollIntoView({block:"center",behavior:"smooth"});b.classList.add("hl");setTimeout(()=>b.classList.remove("hl"),1500)}else toast("Message not found")},
  /* viewer */
  view:e=>{
    const m=msgOf(e.dataset.id),k=kindOf(m),v=$("#vc");S.vm=m;
    if(k==="image")v.innerHTML=`<img src="${esc(m.url)}">`;
    else if(k==="pdf")v.innerHTML=`<iframe src="${esc(m.url)}"></iframe>`;
    else if(k==="txt"){v.innerHTML='<pre>Loading…</pre>';fetch(m.url).then(r=>r.text()).then(t=>v.innerHTML="<pre>"+esc(t.slice(0,30000))+"</pre>")}
    else return download(m);
    $("#viewer").classList.add("show");
  },
  closeview:()=>{$("#viewer").classList.remove("show");$("#vc").innerHTML=""},
  dl:()=>{const m=$("#viewer").classList.contains("show")?S.vm:msgOf(S.menu);hideMenu();if(m)download(m)},
  /* calls */
  call:e=>startCall(e.dataset.v==="1"),
  canswer:answerCall,
  cdecline:()=>{if(S.inc){cid0=S.inc.cid;peer=S.inc.from}endCall()},
  cend:()=>endCall()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el)A[el.dataset.act]?.(el,e)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="txt")A.send();if(e.key==="Enter"&&e.target.id==="thi")A.thsend()});
/* drag the PNG inside the preview bubble to move it */
let dg=null;
document.addEventListener("pointerdown",e=>{const k=e.target.closest("#bprev .stk");if(k){dg=k;k.setPointerCapture(e.pointerId);e.preventDefault()}});
document.addEventListener("pointermove",e=>{
  if(!dg)return;const r=dg.parentElement.getBoundingClientRect();
  const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
  dg.style.left=x+"%";dg.style.top=y+"%";dg.dataset.x=x;dg.dataset.y=y;
});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{
  if(!dg)return;const g=dg.dataset.g;
  if(dg.dataset.x)putG(g,{...getG(g),ix:Math.round(dg.dataset.x),iy:Math.round(dg.dataset.y)});
  dg=null;
}));
document.addEventListener("input",e=>{
  const k=e.target.dataset?.bs;if(!k)return;
  const [g,f]=k.split(".");S.set=S.set||{};
  const v=e.target.type==="range"?+e.target.value:e.target.value;if(f)setLocal(g,{...getG(g),[f]:v});else S.set.r=v;
  bubPrev();saveB(g);
});
document.addEventListener("change",e=>{if(e.target.id==="baud"){flushB();S.aud=e.target.value;keep(draw)}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim().toLowerCase();fill()}});
/* long-press (or right-click) a bubble to open the menu */
let pt;
let sx=0,sy=0,sr=null,sd=0;
document.addEventListener("touchstart",e=>{
  if(e.target.closest(".vpbar"))return;
  const b=e.target.closest(".b");if(b)pt=setTimeout(()=>{sr=null;showMenu(b)},450);
  const r=e.target.closest(".mr");if(r&&!e.target.closest("audio")){sr=r;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sd=0}
},{passive:true});
/* swipe a message to the right to reply */
document.addEventListener("touchmove",e=>{if(!sr)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(!sd&&Math.abs(dy)>Math.abs(dx)){sr=null;return}sd=Math.max(0,Math.min(dx,70));sr.style.transform=sd?`translateX(${sd}px)`:""},{passive:true});
document.addEventListener("touchend",()=>{if(!sr)return;if(sd>=55){const m=msgOf(sr.dataset.id);if(m)startReply(m)}sr.style.transform="";sr=null},{passive:true});
["touchend","touchmove","touchcancel"].forEach(t=>document.addEventListener(t,()=>clearTimeout(pt),{passive:true}));
document.addEventListener("contextmenu",e=>{const b=e.target.closest(".b");if(b){e.preventDefault();showMenu(b)}});
/* video player: tap = play/pause, drag the thin line to seek */
for(const ev of["timeupdate","play","pause","ended"])document.addEventListener(ev,e=>{
  const v=e.target;if(v.tagName!=="VIDEO")return;const p=v.closest(".vp");if(!p)return;
  p.classList.toggle("paused",v.paused);
  p.querySelector(".vpfill").style.width=(v.duration?v.currentTime/v.duration*100:0)+"%";
},true);
/* only one thing plays at a time: starting any video or voice note pauses the rest */
document.addEventListener("play",e=>{
  const t=e.target;if(!["VIDEO","AUDIO"].includes(t.tagName)||t.closest("#cm"))return;
  document.querySelectorAll(".vp video,audio").forEach(o=>o!==t&&o.pause());
},true);
let sk=null;
const seek=e=>{const r=sk.getBoundingClientRect(),v=sk.closest(".vp").querySelector("video");if(v.duration)v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".vpbar");if(b){sk=b;b.setPointerCapture(e.pointerId);b.closest(".vp").classList.add("drag");seek(e)}});
document.addEventListener("pointermove",e=>{if(sk)seek(e)});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{if(sk){sk.closest(".vp").classList.remove("drag");sk=null}}));
document.addEventListener("change",async e=>{
  const f=e.target.files?.[0];if(!f)return;const id=e.target.id;e.target.value="";
  try{
    if(id==="pfile"){S.pf=f;$("#pname").textContent=f.name;return}
    toast("Uploading…");const r=await upload(f);
    if(id==="file")await send({url:r.url,type:r.type,mime:r.mime,name:r.name});
    if(id==="afile")await update(ref(db,"users/"+S.me.uid),{photo:r.url});
    if(id==="bpngf"){const g=S.bg;putG(g,{...getG(g),img:r.url,ix:50,iy:50,is:40,ir:0});keep(draw)}
  }catch(x){toast(x.message)}
});
</script>
</body>

name: build
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: d
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        run: |
          npm install
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          sed -i "s#PAGES_URL#https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/#" capacitor.config.json
          npx cap add android
      # Without these in AndroidManifest.xml Android never shows the mic/camera dialogs and WebRTC calls can fail
      - name: Add permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          add = ""
          for x in ["INTERNET", "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", "ACCESS_NETWORK_STATE", "ACCESS_WIFI_STATE"]:
              if "android.permission." + x not in s:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % x
          for f in ["camera", "microphone"]:
              if "android.hardware." + f not in s:
                  add += '    <uses-feature android:name="android.hardware.%s" android:required="false" />\n' % f
          if add:
              s = s.replace("<application", add + "    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml
          grep "uses-" android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: us-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

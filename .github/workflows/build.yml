
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: d
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          npm install

          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"

          sed -i "s#PAGES_URL#https://$OWNER.github.io/$REPO/#g" capacitor.config.json

          npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"

          s = open(p, encoding="utf-8").read()

          add = ""

          permissions = [
              "INTERNET",
              "RECORD_AUDIO",
              "CAMERA",
              "MODIFY_AUDIO_SETTINGS",
              "ACCESS_NETWORK_STATE",
              "ACCESS_WIFI_STATE"
          ]

          for x in permissions:
              tag = "android.permission." + x
              if tag not in s:
                  add += '    <uses-permission android:name="%s" />\n' % tag

          features = ["camera", "microphone"]

          for f in features:
              tag = "android.hardware." + f
              if tag not in s:
                  add += '    <uses-feature android:name="%s" android:required="false" />\n' % tag

          if add:
              s = s.replace("<application", add + "    <application", 1)

          open(p, "w", encoding="utf-8").write(s)
          PY

          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets/public

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: us-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
